<html><body><h1>Ligand Workbench</h1><p>项目适配器提供显示控件和科学选择。工具负责窗口、手动显隐观察、会话恢复与另存。</p><p><b>ligwork save</b> 将全部地图内嵌另存为新编号 CXS；<b>ligwork export</b> 导出 PNG；两者写入明确部署的正式作者输出目录。<b>ligwork status</b> 在 Log 中说明当前显示，指定 JSON 文件时只能写入项目临时目录。</p><p>恢复已有会话不会重新应用预设、读取外部地图或改变相机。具体科学控件请阅读当前 Figure 的 workbench/README.md。</p></body></html>
